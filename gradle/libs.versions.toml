[versions]
kotlin = "2.0.21"
serialization = "1.6.3"
coroutines = "1.8.1"

[libraries]
# Provided at runtime by the Aniyomi app; compile against them only.
aniyomi-lib = { module = "com.github.aniyomiorg:extensions-lib", version = "14" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
injekt = "com.github.mihonapp:injekt:91edab2317"
rxjava = { module = "io.reactivex:rxjava", version = "1.3.8" }
jsoup = { module = "org.jsoup:jsoup", version = "1.16.1" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.0.0-alpha.11" }
androidx-preference = { module = "androidx.preference:preference", version = "1.2.1" }

# Bundled into the APK.
opencc4j = { module = "com.github.houbb:opencc4j", version = "1.8.1" }

[bundles]
provided = ["aniyomi-lib", "kotlin-stdlib", "kotlin-json", "coroutines-core", "injekt", "rxjava", "jsoup", "okhttp", "androidx-preference"]
